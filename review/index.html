<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Review | FlowReview</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e0f13">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .brand{ display: flex; align-items: center; gap: 8px; flex: none; font-weight: 800; font-size: 16px; letter-spacing: -0.035em; text-decoration: none; padding-right: 4px; }
  .brand .wm, .wordmark .wm{ color: var(--text); }
  .brand .wm span, .wordmark .wm span{ color: var(--accent-ink); }
  .brand .logo{ width: 20px; height: auto; }
  .wordmark .logo{ width: 28px; height: auto; }
  .wordmark{ display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: -0.035em; color: var(--text); }
  .msg{ min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; }
  .msg .card{ max-width: 420px; display: grid; gap: 14px; justify-items: center; color: var(--text-dim); line-height: 1.55; }
    .msg .card strong{ color: var(--text); font-size: 18px; letter-spacing: -0.02em; }
  .made{ display: block; text-align: center; padding: 10px; font-size: 11.5px; color: var(--muted); text-decoration: none; border-top: 1px solid var(--line); }
  .made b{ color: var(--text-dim); }
  .made:hover b{ color: var(--text); }
  .decide{ display: flex; gap: 8px; }
  @media (max-width: 600px){
    .decide{ order: 10; width: 100%; }
    .decide .btn{ flex: 1; }
  }
</style>
</head>
<body>

<div class="msg" id="msgView"><div class="card"><span class="wordmark"><img class="logo" src="/logo.png" alt="" width="28" height="33"><span class="wm">Flow<span>Review</span></span></span><strong id="msgTitle">Loading the review…</strong><span id="msgText"></span></div></div>

<div class="rv" id="app" hidden>
  <header class="rv-top">
    <a class="brand" href="/" target="_blank" rel="noopener" aria-label="FlowReview"><img class="logo" src="/logo.png" alt="" width="20" height="23"><span class="wm">Flow<span>Review</span></span></a>
    <div class="t"><h1 id="title"></h1><div class="sub" id="sub"></div></div>
    <select id="version" aria-label="Version"></select>
    <span class="pill" id="status"></span>
    <span class="grow"></span>
    <div class="decide" id="decide">
      <button class="btn ghost" type="button" id="changesBtn">Needs changes</button>
      <button class="btn good" type="button" id="approveBtn"></button>
    </div>
  </header>
  <div class="rv-body">
    <div class="rv-stage">
      <div class="rv-banner" id="banner" hidden></div>
      <div id="player" class="cfp"></div>
    </div>
    <aside class="rv-side">
      <div class="side-head"><h2>Comments</h2><span class="count" id="count">0</span><span class="grow"></span><label><input type="checkbox" id="hideDone">Hide done</label></div>
      <div class="cm-list" id="list"></div>
      <div class="composer">
        <div class="box">
          <textarea id="noteText" rows="2" maxlength="2000" placeholder="Leave a comment at this moment…" aria-label="Your comment"></textarea>
          <div class="foot"><button type="button" class="tc at" id="at" title="Your comment is pinned to this moment"><span id="atIco"></span><span id="atTime">0:00</span></button><span class="grow"></span><button class="btn" type="button" id="post">Send</button></div>
        </div>
        <div class="as" id="asLine"></div>
      </div>
      <a class="made" href="/" target="_blank" rel="noopener">Made with <b>FlowReview</b></a>
    </aside>
  </div>
</div>

<dialog id="nameDlg">
  <form id="nameForm">
    <h2>What's your name?</h2>
    <p id="nameWhy">So <span class="ed">your editor</span> knows who left each comment.</p>
    <input id="nameInput" maxlength="60" autocomplete="name" placeholder="Your name" aria-label="Your name" required>
    <div class="row"><button class="btn ghost" type="button" id="nameCancel">Cancel</button><button class="btn" type="submit">Continue</button></div>
  </form>
</dialog>

<dialog id="decideDlg">
  <form id="decideForm">
    <h2 id="decideTitle"></h2>
    <p id="decideText"></p>
    <textarea id="decideNote" rows="3" maxlength="1000" placeholder="Add a note (optional)" aria-label="Note"></textarea>
    <div class="row"><button class="btn ghost" type="button" id="decideCancel">Cancel</button><button class="btn" type="submit" id="decideGo"></button></div>
  </form>
</dialog>

<script src="/assets/player.js"></script>
<script>
(function () {
  'use strict';
  var API = 'https://creativeflow-ai.netlify.app/api/review/';
  var token = (location.hash || '').replace('#', '') || new URLSearchParams(location.search).get('t') || '';
  var $ = function (id) { return document.getElementById(id); };
  var I = CF.icons, el = CF.el, toast = CF.toast, fmt = CF.fmt;
  var st = { project: null, comments: [], version: 0, name: '', activeId: null };
  try { st.name = localStorage.getItem('cf.reviewName') || ''; } catch (e) {}
  var player = null;
  $('atIco').innerHTML = I.clock;
  $('approveBtn').innerHTML = I.check + '<span>Approve</span>';

  function editor() { return (st.project && st.project.editor) || 'your editor'; }
  function message(title, text) { $('msgTitle').textContent = title; $('msgText').textContent = text || ''; $('msgView').hidden = false; $('app').hidden = true; }
  function api(body) {
    return fetch(API + token, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); });
  }

  // Asks for the viewer's name the first time they comment or decide, then carries on.
  var afterName = null;
  function needName(then) {
    if (st.name) { then(); return; }
    afterName = then;
    document.querySelectorAll('#nameWhy .ed').forEach(function (s) { s.textContent = editor(); });
    $('nameInput').value = ''; $('nameDlg').showModal(); setTimeout(function () { $('nameInput').focus(); }, 30);
  }
  $('nameForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var n = $('nameInput').value.trim(); if (!n) return;
    st.name = n; try { localStorage.setItem('cf.reviewName', n); } catch (err) {}
    $('nameDlg').close(); renderAs();
    var f = afterName; afterName = null; if (f) f();
  });
  $('nameCancel').addEventListener('click', function () { afterName = null; $('nameDlg').close(); });
  function renderAs() {
    var box = $('asLine'); box.textContent = '';
    if (!st.name) { box.textContent = 'Pause anywhere and type. Your comment is pinned to that moment.'; return; }
    var b = el('button', '', 'change'); b.type = 'button';
    b.addEventListener('click', function () { st.name = ''; needName(function () {}); });
    box.append('Commenting as ' + st.name + ' · ', b);
  }

  function load(first) {
    return api().then(function (r) {
      if (!r.ok) { if (first) message(r.status === 404 ? 'This link isn\'t valid any more' : 'Couldn\'t load the review', r.status === 404 ? 'Ask your editor to send you a new one.' : 'Check your connection and reload the page.'); return; }
      var p = r.d.project;
      var newVersion = !st.project || p.versions.length !== st.project.versions.length;
      st.project = p; st.comments = r.d.comments;
      document.title = p.title + ' | Review';
      if (!p.versions.length) { message(p.title, 'The first cut isn\'t up yet. You\'ll be able to watch and comment here as soon as ' + editor() + ' uploads it.'); return; }
      if (first || $('app').hidden) { $('msgView').hidden = true; $('app').hidden = false; if (!player) setupPlayer(); }
      $('title').textContent = p.title;
      $('sub').textContent = 'From ' + editor() + (p.client ? ' for ' + p.client : '');
      var s = $('status'); s.className = 'pill ' + p.status; s.textContent = CF.STATUS[p.status] || p.status;
      var sel = $('version'); var keep = st.version; sel.innerHTML = '';
      p.versions.slice().reverse().forEach(function (v) { var o = el('option', '', 'V' + v.n + (v.n === p.versions.length ? ' (latest)' : '')); o.value = v.n; sel.appendChild(o); });
      sel.hidden = p.versions.length < 2;
      if (newVersion || !keep) pick(p.versions[p.versions.length - 1].n, true);
      else pick(keep, false);
      renderAs();
    }).catch(function () { if (first) message('Couldn\'t reach the server', 'Check your connection and reload the page.'); });
  }

  function setupPlayer() {
    player = CF.player($('player'));
    player.video.addEventListener('timeupdate', function () { $('atTime').textContent = fmt(player.time()); if (!player.video.paused) { st.activeId = null; highlight(); } });
  }
  function pick(n, reload) {
    var v = st.project.versions.filter(function (x) { return x.n === n; })[0];
    if (!v) return;
    if (reload || st.version !== n) player.load(v.url);
    st.version = n; $('version').value = String(n);
    var latest = st.project.versions.length;
    var d = (st.project.decisions || []).filter(function (x) { return x.version === n; }).slice(-1)[0];
    var bn = $('banner');
    if (d) { bn.hidden = false; bn.className = 'rv-banner ' + d.decision; bn.textContent = (d.decision === 'approved' ? '✓ Approved by ' : 'Changes requested by ') + d.name + ' · ' + CF.ago(d.at) + (d.note ? ' · "' + d.note + '"' : ''); }
    else if (n !== latest) { bn.hidden = false; bn.className = 'rv-banner'; bn.textContent = 'You\'re watching an older version. The latest is V' + latest + '.'; }
    else bn.hidden = true;
    $('decide').hidden = n !== latest;
    render();
  }
  $('version').addEventListener('change', function () { pick(Number($('version').value)); });

  function render() {
    var all = st.comments.filter(function (c) { return c.version === st.version; });
    var list = all.filter(function (c) { return !($('hideDone').checked && c.done); });
    $('count').textContent = all.length;
    var box = $('list'); box.innerHTML = '';
    if (!all.length) box.appendChild(el('div', 'empty', 'No comments yet. Pause the video anywhere and leave one below. It\'s pinned to that exact moment.'));
    else if (!list.length) box.appendChild(el('div', 'empty', 'Everything here is done.'));
    list.forEach(function (c) {
      var ed = c.by !== 'client';
      var row = el('div', 'cm' + (c.done ? ' done' : '')); row.dataset.t = c.t; row.dataset.id = c.id;
      row.appendChild(CF.avatar(c.name));
      var main = el('div', 'main'), head = el('div', 'head');
      head.appendChild(el('span', 'who', c.name));
      if (ed) head.appendChild(el('span', 'tag', 'EDITOR'));
      head.appendChild(el('span', 'when', CF.ago(c.created)));
      head.appendChild(el('span', 'grow'));
      if (c.done) { var ck = el('span', 'check on static'); ck.innerHTML = I.check; ck.title = 'Done'; head.appendChild(ck); }
      var text = el('div', 'text'); var tc = el('button', 'tc', fmt(c.t)); tc.type = 'button';
      text.append(tc, el('span', 'body', c.text));
      main.append(head, text); row.appendChild(main);
      row.addEventListener('click', function () { st.activeId = c.id; player.seek(c.t); highlight(); });
      box.appendChild(row);
    });
    player.setMarks(all, function (m) {
      st.activeId = m.id; highlight();
      var r = document.querySelector('.cm[data-id="' + m.id + '"]'); if (r) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
    $('approveBtn').querySelector('span').textContent = 'Approve V' + st.version;
    highlight();
  }
  function highlight() {
    var now = player ? player.time() : 0;
    document.querySelectorAll('.cm').forEach(function (n) { n.classList.toggle('active', n.dataset.id === st.activeId || (!st.activeId && Math.abs(Number(n.dataset.t) - now) < 1.5)); });
  }
  $('hideDone').addEventListener('change', render);

  function post() {
    var text = $('noteText').value.trim();
    if (!text) { $('noteText').focus(); return; }
    var t = player.time();
    needName(function () {
      var btn = $('post'); btn.disabled = true;
      api({ action: 'comment', name: st.name, version: st.version, t: t, text: text }).then(function (r) {
        btn.disabled = false;
        if (!r.ok) { toast(r.d.error && r.d.error.code === 'daily_limit' ? 'That\'s a lot of comments for one day. Try again tomorrow.' : 'Couldn\'t post that. Try again.'); return; }
        $('noteText').value = '';
        st.comments.push(r.d.comment); st.comments.sort(function (a, b) { return (a.version - b.version) || (a.t - b.t); });
        if (st.project.status === 'approved') st.project.status = 'in_review';
        st.activeId = r.d.comment.id; render(); toast('Comment added at ' + fmt(r.d.comment.t));
      }).catch(function () { btn.disabled = false; toast('Couldn\'t reach the server. Try again.'); });
    });
  }
  $('post').addEventListener('click', post);
  $('noteText').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); post(); } });
  $('noteText').addEventListener('focus', function () { if (player) player.video.pause(); });
  $('at').addEventListener('click', function () { player.video.pause(); $('noteText').focus(); });

  // approve / needs changes
  var deciding = null;
  function decide(decision) {
    needName(function () {
      deciding = decision;
      var ok = decision === 'approved';
      $('decideTitle').textContent = ok ? 'Approve V' + st.version + '?' : 'Ask for changes on V' + st.version + '?';
      $('decideText').textContent = ok ? 'This tells ' + editor() + ' the video is ready to go.' : 'Your comments on the video are already sent. Add anything else ' + editor() + ' should know.';
      $('decideGo').textContent = ok ? 'Approve' : 'Send';
      $('decideGo').className = 'btn' + (ok ? ' good' : '');
      $('decideNote').value = ''; $('decideDlg').showModal();
    });
  }
  $('decideCancel').addEventListener('click', function () { $('decideDlg').close(); });
  $('decideForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var decision = deciding; $('decideDlg').close();
    api({ action: 'decide', name: st.name, version: st.version, decision: decision, note: $('decideNote').value.trim() }).then(function (r) {
      if (!r.ok) { toast('Couldn\'t send that. Try again.'); return; }
      toast(decision === 'approved' ? 'Approved. Thank you!' : 'Sent. Changes are on the way.');
      load(false);
    }).catch(function () { toast('Couldn\'t reach the server. Try again.'); });
  });
  $('approveBtn').addEventListener('click', function () { decide('approved'); });
  $('changesBtn').addEventListener('click', function () { decide('changes'); });

  if (!/^[0-9a-f]{32}$/.test(token)) { message('This link isn\'t complete', 'Open the full link you were sent.'); return; }
  load(true);
  // New comments and versions from the editor appear without reloading.
  setInterval(function () { if (!document.hidden && st.project) load(false); }, 20000);
})();
</script>
</body>
</html>
